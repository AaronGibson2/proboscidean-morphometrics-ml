  <g id="text_7">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="51.84" y="41.472" transform="rotate(-0 51.84 41.472)">Why 75% overall can still be a poor result</text>
  </g>
  <g id="text_8">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="51.84" y="71.424" transform="rotate(-0 51.84 71.424)">Lower teeth, original whole-image method: every specimen's nearest neighbor comes from Love.</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="69.12" y="336.384" transform="rotate(-0 69.12 336.384)">Overall: 12/16 = 75%</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="449.28" y="336.384" transform="rotate(-0 449.28 336.384)">Balanced: (100% + 0% + 0%) / 3 = 33.3%</text>
  </g>
  <g id="text_11">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="69.12" y="377.856" transform="rotate(-0 69.12 377.856)">Love supplies most of the specimens, so it dominates the overall score.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d43" x="69.12" y="407.808" transform="rotate(-0 69.12 407.808)">But zero Mixson and zero Tyner specimens find a same-site neighbor. This method is not separating all three sites.</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #758392" x="69.12" y="440.064" transform="rotate(-0 69.12 440.064)">Green circle = correct neighbor group. Orange cross = wrong neighbor group. One symbol = one catalog ID.</text>
  </g>
